spring.application.name=loginseguro

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=loginseguro
spring.data.mongodb.auto-index-creation=true

spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ------------------------------------------------------------------
# E-mail (notifier) e verificação em duas etapas no cadastro
# ------------------------------------------------------------------
# console = apenas registra o código no log (desenvolvimento)
# smtp    = envia de verdade usando as credenciais abaixo
app.mail.mode=${MAIL_MODE:console}
app.mail.from=${MAIL_FROM:no-reply@loginseguro.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

app.registration.code-expiration-minutes=10
app.registration.resend-cooldown-seconds=60
app.registration.max-attempts=5
