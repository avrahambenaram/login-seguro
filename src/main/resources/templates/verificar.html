<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificação em duas etapas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-zinc-200 min-h-screen flex justify-center items-center p-4">
    <div class="bg-white rounded-lg p-6 shadow-md w-full max-w-sm flex flex-col items-center gap-4">
      <div class="text-center">
        <h2 class="text-lg font-semibold text-zinc-800">Verificação em duas etapas</h2>
        <p class="text-xs text-zinc-500 mt-1">
          Enviamos um código de 6 dígitos para
          <span class="font-medium text-zinc-700" th:text="${email}">email</span>.
        </p>
      </div>

      <div th:if="${erro}" class="w-full text-red-600 text-sm bg-red-50 border border-red-200 rounded p-2" th:text="${erro}">Erro</div>
      <div th:if="${sucesso}" class="w-full text-green-700 text-sm bg-green-50 border border-green-200 rounded p-2" th:text="${sucesso}">Sucesso</div>

      <form class="w-full flex flex-col items-center gap-4" th:action="@{/verificar}" method="POST">
        <input type="hidden" name="email" th:value="${email}">
        <div th:replace="~{fragments/input :: input(
            'text',
            'code',
            '000000',
            'Código de verificação',
            ''
        )}"></div>
        <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition">
          <span>Confirmar</span>
        </button>
      </form>

      <form class="w-full" th:action="@{/registrar/reenviar}" method="POST">
        <input type="hidden" name="email" th:value="${email}">
        <button type="submit" class="w-full text-sm text-blue-600 hover:text-blue-800 transition-all">
          Reenviar código
        </button>
      </form>

      <a href="/registrar" class="cursor-pointer text-xs text-zinc-500 hover:text-zinc-700 transition-all">Voltar ao cadastro</a>
    </div>
  </body>
</html>
