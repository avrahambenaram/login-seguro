<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LoginSeguro — Usuários</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-zinc-100 min-h-screen text-zinc-800">
    <main class="max-w-5xl mx-auto px-4 py-8 flex flex-col justify-center items-end">
      <div th:unless="${isAdmin}" class="mb-4 text-amber-800 text-sm bg-amber-50 border border-amber-200 rounded p-3">
        Você está no modo somente leitura. Apenas administradores podem editar ou excluir usuários.
      </div>

      <div class="bg-white rounded-lg shadow-sm border border-zinc-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-zinc-100 flex items-center justify-between">
          <h2 class="font-semibold">Usuários cadastrados</h2>
          <span class="text-xs text-zinc-500" th:text="${#lists.size(users)} + ' usuário(s)'">0</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-zinc-50 text-zinc-500 text-left">
              <tr>
                <th class="px-5 py-3 font-medium">Nome</th>
                <th class="px-5 py-3 font-medium">E-mail</th>
                <th class="px-5 py-3 font-medium">Tipo</th>
                <th class="px-5 py-3 font-medium text-right" th:if="${isAdmin}">Ações</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-zinc-100">
              <tr th:if="${#lists.isEmpty(users)}">
                <td class="px-5 py-6 text-center text-zinc-500" th:colspan="${isAdmin ? 4 : 3}">Nenhum usuário cadastrado.</td>
              </tr>
              <tr th:each="u : ${users}"
                  class="hover:bg-zinc-50/70"
                  th:classappend="${currentUser != null and currentUser.id.equals(u.id)} ? 'bg-blue-50/60'">
                <td class="px-5 py-3 align-middle">
                  <form th:if="${isAdmin}"
                        th:action="@{/usuarios/{id}/editar(id=${u.id})}"
                        method="post"
                        class="flex items-center gap-2">
                    <input name="username"
                           th:value="${u.username}"
                           required
                           minlength="3"
                           maxlength="30"
                           class="w-40 border border-zinc-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded px-3 py-1 text-xs font-medium transition">
                      Salvar
                    </button>
                  </form>
                  <span th:unless="${isAdmin}" th:text="${u.username}">nome</span>
                </td>
                <td class="px-5 py-3 align-middle text-zinc-600" th:text="${u.email}">email</td>
                <td class="px-5 py-3 align-middle">
                  <span th:with="roleName=${u.role != null ? u.role.name() : 'USER'}"
                        th:text="${roleName}"
                        th:classappend="${roleName == 'ADMIN'
                            ? 'bg-red-100 text-red-700'
                            : (roleName == 'MANAGER' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700')}"
                        class="px-2 py-0.5 rounded-full text-xs font-semibold">
                    USER
                  </span>
                </td>
                <td class="px-5 py-3 align-middle text-right" th:if="${isAdmin}">
                  <form th:action="@{/usuarios/{id}/deletar(id=${u.id})}"
                        method="post"
                        onsubmit="return confirm('Tem certeza que deseja excluir este usuário?')">
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white rounded px-3 py-1 text-xs font-medium transition">
                      Excluir
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <form method="POST", th:action="@{/logout}" class="text-red-600 mt-4">
        <button type="submit" class="cursor-pointer">
          <span>Sair da conta</span>
        </button>
      </form>
    </main>
  </body>
</html>
